name: Validate and publish userscript

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publish runs never overlap; superseded source SHAs are checked before pushing.
concurrency:
  group: chromora-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint-check
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run test:bundle
      - run: npm run docs -- generated-api-docs
      - name: Record artifact provenance
        run: |
          printf '%s\n' "$GITHUB_SHA" > build-source-sha.txt
          sha256sum dist/Chromora.user.js dist/Chromora.user.css.map.json src/BlueMarble.meta.js src/main.css > build-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: userscript-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/Chromora.user.js
            dist/Chromora.user.css.map.json
            src/BlueMarble.meta.js
            src/main.css
            generated-api-docs/
            build-source-sha.txt
            build-checksums.txt

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: userscript-${{ github.sha }}
      - name: Publish the validated source snapshot
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(cat build-source-sha.txt)" = "$SOURCE_SHA"
          sha256sum --check build-checksums.txt
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo 'A newer source commit exists; skip publishing this snapshot.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/Chromora.user.js dist/Chromora.user.css.map.json src/BlueMarble.meta.js src/main.css
          if ! git diff --cached --quiet; then
            # Commit text is data in a file. Never interpolate it into shell code.
            printf 'Build userscript from %s\n\n' "$SOURCE_SHA" > "$RUNNER_TEMP/chromora-commit.txt"
            git log -1 --format=%B "$SOURCE_SHA" >> "$RUNNER_TEMP/chromora-commit.txt"
            git commit --file "$RUNNER_TEMP/chromora-commit.txt"
            # Publish both refs together after preparing the documentation snapshot.
          fi
          published_sha=$(git rev-parse HEAD)
          # Keep API docs on the dedicated branch without resetting shared staging branches.
          wiki_sha=$(git ls-remote origin refs/heads/wiki | cut -f1)
          cp -R generated-api-docs/. docs/
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Generate API docs for $SOURCE_SHA"
          fi
          # Leases protect changes arriving after the freshness check. Atomic push
          # ensures main and wiki either both reference this build or neither moves.
          git push --atomic \
            --force-with-lease="refs/heads/main:$SOURCE_SHA" \
            --force-with-lease="refs/heads/wiki:$wiki_sha" \
            origin "$published_sha:refs/heads/main" HEAD:refs/heads/wiki
